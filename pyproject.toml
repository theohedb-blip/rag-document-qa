[project]
name = "rag-document-qa"
version = "1.0.0"
description = "A small, readable RAG document Q&A prototype: FastAPI + Chroma + OpenAI (or Claude)."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
